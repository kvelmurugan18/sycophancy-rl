name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver (e.g. 0.3.0)"
        required: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e ".[dev]"
      - name: Test
        run: HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 HF_DATASETS_OFFLINE=1 pytest -q -p no:cacheprovider --strict-markers
      - name: Validate requested version
        run: |
          python -c "import tomllib; expected='${{ inputs.version }}'; actual=tomllib.load(open('pyproject.toml','rb'))['project']['version']; assert actual == expected, f'input {expected} != pyproject {actual}'"
      - name: Smoke
        run: |
          syco --help
          syco doctor
          syco setup
          syco train --profile smoke --allow-cpu --no-4bit --preflight-only
      - name: Kaggle dry-run
        run: |
          syco kaggle init --username ci-user --output /tmp/kernel.json
          syco kaggle validate --metadata /tmp/kernel.json
          syco train --runner kaggle --dry-run
