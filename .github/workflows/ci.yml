name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: |
          HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 HF_DATASETS_OFFLINE=1 pytest -q -p no:cacheprovider --strict-markers

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e ".[dev]"
      - name: mypy
        run: mypy src

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          pip install build
          python -m build --sdist --wheel
      - name: Smoke-test the built wheel
        run: |
          python -m venv /tmp/syco-wheel-smoke
          /tmp/syco-wheel-smoke/bin/pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/syco-wheel-smoke/bin/python -c "import sycophancy_rl; print(sycophancy_rl.__version__)"

  docker-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install hadolint
        run: |
          curl -L -o /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          chmod +x /usr/local/bin/hadolint
      - name: Lint trainer Dockerfile
        run: |
          hadolint Dockerfile.trainer
      - name: Validate Compose
        run: |
          docker compose -f docker-compose.trainer.yml config --quiet

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: Audit dependency profiles
        run: |
          pip-audit -r requirements.txt
          pip-audit -r deploy/trainer/requirements.lock
          pip-audit -r deploy/kaggle/requirements.lock
          pip-audit -r deploy/env-server/requirements.lock
          pip-audit -r deploy/demo-space/requirements.txt

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for secrets
        run: |
          ! grep -RInE "(BEGIN RSA|BEGIN OPENSSH|api_key=|token=)" src deploy || (echo "secret found" && exit 1)

  cli-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: CLI smoke
        run: |
          syco --help
          syco doctor
          syco version
          syco setup

  demo-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install demo dependencies
        run: pip install -e ".[demo]"
      - name: Construct the Gradio application
        run: python -c "import runpy; runpy.run_path('deploy/demo-space/app.py')"
