[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sycophancy-rl"
version = "0.2.0"
description = "Leakage-safe local GRPO experiments for measuring user-opinion matching."
requires-python = ">=3.10,<3.13"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "sycophancy-rl contributors" }]
keywords = ["sycophancy", "rl", "grpo", "lora", "qlora", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = []

[project.optional-dependencies]
train = [
    # Preserve compatible preinstalled Kaggle/CUDA wheels. Local setup
    # scripts install the exact reference PyTorch build first.
    "torch>=2.13,<2.14",
    "transformers==5.14.1",
    "trl==1.8.0",
    "peft==0.19.1",
    "bitsandbytes==0.49.2",
    "datasets==5.0.0",
    "accelerate==1.14.0",
    "huggingface-hub==1.25.1",
    "tensorboard==2.21.0",
    "psutil>=5.9,<7",
]
dev = [
    "pytest==9.1.1",
    "httpx>=0.27,<1",
    "fastapi==0.141.1",
    "pydantic==2.12.3",
    "mypy>=1.10,<2",
    "ruff>=0.6,<1",
]
demo = [
    "fastapi==0.141.1",
    "uvicorn==0.40.0",
    "pydantic==2.12.3",
    "gradio==6.22.0",
    "pillow==12.3.0",
    "requests==2.34.2",
]
kaggle = [
    "kaggle==1.7.4.5; python_version < '3.11'",
    "kaggle==2.2.3; python_version >= '3.11'",
]
capability = [
    "lm-eval[hf]==0.4.12",
]
all = [
    "torch>=2.13,<2.14",
    "transformers==5.14.1",
    "trl==1.8.0",
    "peft==0.19.1",
    "bitsandbytes==0.49.2",
    "datasets==5.0.0",
    "accelerate==1.14.0",
    "huggingface-hub==1.25.1",
    "tensorboard==2.21.0",
    "psutil>=5.9,<7",
    "pytest==9.1.1",
    "httpx>=0.27,<1",
    "mypy>=1.10,<2",
    "ruff>=0.6,<1",
    "fastapi==0.141.1",
    "uvicorn==0.40.0",
    "pydantic==2.12.3",
    "gradio==6.22.0",
    "pillow==12.3.0",
    "requests==2.34.2",
    "kaggle==1.7.4.5; python_version < '3.11'",
    "kaggle==2.2.3; python_version >= '3.11'",
]

[project.urls]
Homepage = "https://github.com/kvelmurugan18/sycophancy-rl"
Documentation = "https://github.com/kvelmurugan18/sycophancy-rl/tree/main/docs"
Issues = "https://github.com/kvelmurugan18/sycophancy-rl/issues"

[project.scripts]
syco = "sycophancy_rl.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sycophancy_rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
python_files = ["test_*.py"]
pythonpath = ["src"]
markers = []

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
