# -----------------------------------------------------------------------------
# Sycophancy RL — local dev stack.
#
# Running `docker-compose up` from the project root will build and start the
# FastAPI Environment Server on port 8000. The image is built from
# `deploy/env-server/Dockerfile` (see that file for the runtime-deps and
# COPY layout) and exposes the `/health`, `/reset`, `/step`, and `/grader`
# endpoints described in `server/routes/`.
#
# NOTE on the Gradio demo: because `deploy/demo-space/app.py` hard-codes
# `SERVER_URL = "http://localhost:8000"`, the Gradio client expects the
# server to be reachable on the host's localhost. The easiest way to play
# with the demo is:
#
#   1. In one terminal (project root):   docker-compose up
#   2. In another terminal (host):       python deploy/demo-space/app.py
#
# Step 2 launches the Gradio Blocks UI on port 7860 (the default). The
# Gradio client then HTTPs to the env server through the host's
# localhost, which docker-compose's port-mapping (`8000:8000`) makes
# reachable. If you wanted to run the Gradio UI *inside* a container too,
# you'd need to point its SERVER_URL at the env-server container's
# service name instead of localhost, and add a second service to this
# file — but the two-terminal local-dev flow is the simpler default.
# -----------------------------------------------------------------------------

services:
  env-server:
    build:
      context: .
      dockerfile: deploy/env-server/Dockerfile
    ports:
      - "8000:8000"
