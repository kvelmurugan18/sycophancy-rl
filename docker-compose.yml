# Local diagnostic API only. GPU training uses docker-compose.trainer.yml.
services:
  env-server:
    build:
      context: .
      dockerfile: deploy/env-server/Dockerfile
    restart: "no"
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
